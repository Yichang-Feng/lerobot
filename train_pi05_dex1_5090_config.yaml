# ==============================================================================
# Unitree G1 Dex-1 (3Cam + 16-DoF) Pi0.5 LoRA 训练配置 (针对 RTX 5090 32GB)
# ==============================================================================

# 1. 数据集配置 (143 episodes, 72749 frames)
dataset:
  repo_id: "g1_pick_put_dex1_0923"
  root: "datasets/g1_pick_put_dex1_0923"
  video_backend: "torchcodec"

# 2. 策略模型配置
policy:
  path: "model/pi05_base"
  device: "cuda"
  dtype: "bfloat16"
  gradient_checkpointing: true    # 开启梯度检查点，极致省显存
  compile_model: false           # 关闭长时间 Triton 编译，5秒闪电启动
  push_to_hub: false


# 3. 3 相机输入重命名映射 (将数据集字段 1:1 对齐到 pi0.5 原生 3 视角)
rename_map:
  "observation.images.cam_high": "observation.images.base_0_rgb"
  "observation.images.cam_left_wrist": "observation.images.left_wrist_0_rgb"
  "observation.images.cam_right_wrist": "observation.images.right_wrist_0_rgb"

# 4. 全链路 LoRA (PEFT) 适配器设计
peft:
  method_type: "LORA"
  r: 64
  lora_alpha: 128
  target_modules: "(.*(vision_tower|language_model|gemma_expert).*(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj|fc1|fc2)|.*multi_modal_projector\\.linear|model\\.(action_in_proj|action_out_proj))"

# 5. 训练全局控制
output_dir: "outputs/train/pi05_lora_5090_g1_pick_put_dex1_0923"
job_name: "pi05_lora_5090_g1_pick_put_dex1_0923"

batch_size: 16                    # 5090 32G 专属：显存占用约 21~24 GB
steps: 15000                      # 1.5 万步 (~3.3 个 Epochs)
num_workers: 8                    # 5090 算力充沛，充分释放 CPU 多进程视频解码
prefetch_factor: 4
persistent_workers: true

log_freq: 50
save_freq: 1000                   # 每 1000 步保存一个 Checkpoint (保存 1000~15000)
save_checkpoint_to_hub: false
env_eval_freq: 0

# 6. 优化器与预热衰减调度
use_policy_training_preset: false

optimizer:
  type: "adamw"
  lr: 1.0e-4                     # LoRA 峰值学习率
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-4           # 适当权重衰减防过拟合
  grad_clip_norm: 1.0

scheduler:
  type: "cosine_decay_with_warmup"
  num_warmup_steps: 500          # 500 步平稳升温
  num_decay_steps: 15000         # 严格对齐 15000 总步数
  peak_lr: 1.0e-4
  decay_lr: 2.0e-5               # 保留 20% 学习率底限，防止训练末期动作僵化犹豫

wandb:
  enable: false