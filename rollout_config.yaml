# ==============================================================================
# LeRobot + Unitree G1 Rollout 统一配置文件 (rollout_config.yaml)
# ==============================================================================
# 运行方式:
#   lerobot-rollout --config_path=rollout_config.yaml
#
# 覆盖单个参数:
#   lerobot-rollout --config_path=rollout_config.yaml --task="pick blue box" --display_data=true
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 策略模型配置
# ------------------------------------------------------------------------------
policy:
  path: "model/box_move_blue"
  device: "cuda"
  dtype: "bfloat16"

# ------------------------------------------------------------------------------
# 2. 任务指令
# ------------------------------------------------------------------------------
task: "move blue box"

# ------------------------------------------------------------------------------
# 3. 机器人硬件与控制器配置
# ------------------------------------------------------------------------------
robot:
  type: "unitree_g1"
  is_simulation: true
  robot_ip: "192.168.123.164"
  controller: "GrootLocomotionController"
  locomotion_mode: "stand"
  zero_locomotion_cmd: false
  cameras:
    global_view:
      type: "zmq"
      server_address: "localhost"
      port: 5556
      camera_name: "head_camera"
      width: 640
      height: 480
      fps: 30
      warmup_s: 5

# ------------------------------------------------------------------------------
# 4. 异步推理与控制队列 (RTC: Real-Time Chunking)
# ------------------------------------------------------------------------------
inference:
  type: "rtc"
  queue_threshold: 40

# ------------------------------------------------------------------------------
# 5. 动作调度与频率参数
# ------------------------------------------------------------------------------
fps: 25.0
duration: 1000.0
interpolation_multiplier: 3

# ------------------------------------------------------------------------------
# 6. 可视化配置
# ------------------------------------------------------------------------------
display_data: false
