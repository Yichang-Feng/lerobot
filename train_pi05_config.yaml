# ==============================================================================
# Unitree G1 (Rubber Hand) Pi0.5 策略模型微调训练配置文件 (train_pi05_config.yaml)
# ==============================================================================
# 启动方式:
#   python -m lerobot.scripts.lerobot_train --config_path=train_pi05_config.yaml
#
# 后台持久化运行:
#   nohup python -m lerobot.scripts.lerobot_train --config_path=train_pi05_config.yaml > train.log 2>&1 &
#
# 命令行临时覆盖某个参数 (例如临时改步数或学习率):
#   python -m lerobot.scripts.lerobot_train --config_path=train_pi05_config.yaml --steps=2000 --policy.optimizer_lr=1.0e-5
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 数据集配置 (对齐后的转向角速度解耦数据集)
# ------------------------------------------------------------------------------
dataset:
  repo_id: "g1_box_pick_turn_v30"
  root: "datasets/g1_box_pick_turn_v30"

# ------------------------------------------------------------------------------
# 2. 策略模型微调配置
# ------------------------------------------------------------------------------
policy:
  path: "model/box_pick"          # 基础底模权重目录
  train_expert_only: true         # 冻结 2B 视觉语言模型，仅微调 300M 动作专家（省显存并防严重过拟合）
  compile_model: false            # 关闭 Triton 耗时编译，5 秒秒开启动
  device: "cuda"

  # ★ 学习率与调度器控制（保持与下方显式配置同步）
  optimizer_lr: 5.0e-6            # 峰值学习率
  scheduler_decay_lr: 1.5e-6      # 最终衰减目标学习率
  scheduler_warmup_steps: 200     # 线性预热步数
  scheduler_decay_steps: 4000     # 与 steps: 4000 严格对齐

# ------------------------------------------------------------------------------
# 3. 训练全局控制参数
# ------------------------------------------------------------------------------
output_dir: "outputs/train/g1_box_pick_turn_v30"
job_name: "g1_box_pick_turn_v30"

batch_size: 8                     # RTX 4090 D 显存占用约 15~17 GB
steps: 4000                       # 总步数设为 4000 步（覆盖到 4000 步 Checkpoint）
num_workers: 4

log_freq: 50                      # 每 50 步打印一次训练指标
save_freq: 500                    # 每 500 步存盘一次（完美覆盖 500/1000/1500/2000/2500/4000）
env_eval_freq: 0                  # 必须设为 0 关闭仿真内嵌评估

# ------------------------------------------------------------------------------
# 4. 优化器与预设机制说明
# ------------------------------------------------------------------------------
# 显式接管最外层的 optimizer 和 scheduler，杜绝底模默认值隐式覆写
use_policy_training_preset: false

optimizer:
  type: "adamw"
  lr: 5.0e-6                     # ★ 峰值学习率同步修改为 5.0e-6
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-4           # 权重衰减防过拟合
  grad_clip_norm: 1.0

scheduler:
  type: "cosine_decay_with_warmup"
  num_warmup_steps: 200          # 200 步平稳预热
  num_decay_steps: 4000          # ★ 衰减步数必须与 steps: 4000 保持一致
  peak_lr: 5.0e-6                # ★ 峰值学习率对齐为 5.0e-6
  decay_lr: 1.5e-6               # ★ 衰减终点设为 1.5e-6（保留 30% 输出活力，彻底杜绝动作犹豫僵死）

# ------------------------------------------------------------------------------
# 5. 监控看板
# ------------------------------------------------------------------------------
wandb:
  enable: true                   # 是否开启在线 WandB 看板
