# ==============================================================================
# G1 Dex1 (双臂14维+双夹爪2维+三相机) Pi0.5 LoRA 微调配置
# ==============================================================================

dataset:
  repo_id: "g1_pick_put_dex1_0923"
  root: "datasets/g1_pick_put_dex1_0923"
  video_backend: "torchcodec"

policy:
  path: "model/pi05_base"
  device: "cuda"
  dtype: "bfloat16"
  gradient_checkpointing: true
  compile_model: false
  push_to_hub: false

# 3 相机输入重命名映射: 将数据集的键名映射到底模预期的三路相机名
rename_map:
  "observation.images.cam_high": "observation.images.base_0_rgb"
  "observation.images.cam_left_wrist": "observation.images.left_wrist_0_rgb"
  "observation.images.cam_right_wrist": "observation.images.right_wrist_0_rgb"

# LoRA (PEFT) 适配器配置
peft:
  method_type: "LORA"
  r: 64
  lora_alpha: 128
  target_modules: "(.*(vision_tower|language_model|gemma_expert).*(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj|fc1|fc2)|.*multi_modal_projector\\.linear|model\\.(action_in_proj|action_out_proj))"

output_dir: "outputs/train/pi05_lora_g1_pick_put_dex1_0923"
job_name: "pi05_lora_g1_pick_put_dex1_0923"

batch_size: 8
steps: 10000
num_workers: 4
persistent_workers: true

log_freq: 50
save_freq: 1000
save_checkpoint_to_hub: false
env_eval_freq: 0

# 优化器与余弦调度器
use_policy_training_preset: false

optimizer:
  type: "adamw"
  lr: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0

scheduler:
  type: "cosine_decay_with_warmup"
  num_warmup_steps: 500
  num_decay_steps: 10000
  peak_lr: 1.0e-4
  decay_lr: 2.0e-5

wandb:
  enable: false
