# ==============================================================================
# Unitree G1 Dex-1 (3Cam + 16-DoF) Pi0.5 LoRA 双子任务训练配置 (RTX 4090 32GB)
# ==============================================================================
# 对应子任务:
#   Task 0: "pick up the water bottle from the table and place it into the blue box"
#   Task 1: "take the water bottle out of the blue box and place it back on the table"
# ==============================================================================

# 1. 数据集配置 (子任务版本，自动由 apply_dex1_subtask_cut.py 生成)
dataset:
  repo_id: "g1_pick_put_dex1_0923_subtasks"
  root: "datasets/g1_pick_put_dex1_0923_subtasks"
  video_backend: "torchcodec"

# 2. 策略模型配置
policy:
  path: "model/pi05_base"
  device: "cuda"
  dtype: "bfloat16"
  gradient_checkpointing: true
  compile_model: false
  push_to_hub: false

# 3. 3 相机输入重命名映射 (对齐 pi0.5 原生 3 视角)
rename_map:
  "observation.images.cam_high": "observation.images.base_0_rgb"
  "observation.images.cam_left_wrist": "observation.images.left_wrist_0_rgb"
  "observation.images.cam_right_wrist": "observation.images.right_wrist_0_rgb"

# 4. 全链路 LoRA (PEFT) 适配器设计
peft:
  method_type: "LORA"
  r: 64
  lora_alpha: 128
  target_modules: "(.*(vision_tower|language_model|gemma_expert).*(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj|fc1|fc2)|.*multi_modal_projector\\.linear|model\\.(action_in_proj|action_out_proj))"

# 5. 训练全局控制
output_dir: "outputs/train/pi05_lora_4090_g1_pick_put_dex1_subtasks"
job_name: "pi05_lora_4090_g1_pick_put_dex1_subtasks"

batch_size: 8
steps: 10000
num_workers: 4
persistent_workers: true

log_freq: 50
save_freq: 1000
save_checkpoint_to_hub: false
env_eval_freq: 0

# 优化器与余弦调度器
use_policy_training_preset: false

optimizer:
  type: "adamw"
  lr: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0

scheduler:
  type: "cosine_decay_with_warmup"
  num_warmup_steps: 500
  num_decay_steps: 10000
  peak_lr: 1.0e-4
  decay_lr: 2.0e-5

wandb:
  enable: false
